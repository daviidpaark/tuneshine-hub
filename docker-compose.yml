services:
  tuneshine-hub:
    image: ghcr.io/daviidpaark/tuneshine-hub:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tuneshine-hub
    restart: unless-stopped
    ports:
      - "${PORT:-8585}:8585"
    environment:
      # IP address or hostname of your physical Tuneshine device
      - TUNESHINE_HOST=${TUNESHINE_HOST:-192.168.1.100}
      - PORT=${PORT:-8585}

      # Spotify Web API configuration (Optional)
      - SPOTIFY_ENABLED=${SPOTIFY_ENABLED:-false}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REFRESH_TOKEN=${SPOTIFY_REFRESH_TOKEN:-}
      - SPOTIFY_POLL_INTERVAL=${SPOTIFY_POLL_INTERVAL:-5}
      - SPOTIFY_IDLE_POLL_INTERVAL=${SPOTIFY_IDLE_POLL_INTERVAL:-15}
      - SPOTIFY_IDLE_DELAY=${SPOTIFY_IDLE_DELAY:-30.0}
      - SPOTIFY_SERVICENAME=${SPOTIFY_SERVICENAME:-Spotify}

      # Plex Webhook configuration (Optional)
      - PLEX_ENABLED=${PLEX_ENABLED:-true}
      - PLEX_ALLOWED_USERS=${PLEX_ALLOWED_USERS:-}
      - PLEX_ALLOWED_LIBRARIES=${PLEX_ALLOWED_LIBRARIES:-}
      - PLEX_ALLOWED_PLAYERS=${PLEX_ALLOWED_PLAYERS:-}
      - PLEX_URL=${PLEX_URL:-${PLEX_SERVER_URL:-}}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - PLEX_SERVICENAME=${PLEX_SERVICENAME:-Plexamp}
